# Penta Dragon DX - Background Tile Category Mapping
# Generated from analysis of Level 1 savestates
#
# Purpose: Map BG tiles to categories for O(1) colorization
# Instead of scanning all tiles, hook the game's tile write routine
# and apply palette based on tile ID category.

# ==============================================
# TILE CATEGORIES - Level 1 Dungeon Theme
# ==============================================
#
# The game uses 2x2 tile blocks for most elements.
# Items follow a pattern: base, base+1, base+16, base+17
#
# The pre-iter-278w `categories:` block at the bottom is RETAINED for
# historical category names (floor/void/walls/etc.) used elsewhere in
# the codebase. It is documentation only — the bg_table palette assignment
# is now driven by `bg_table:` below, not `categories:`.

# ==============================================
# CANONICAL bg_table — bank13:0x7000 source of truth
# ==============================================
bg_table:
  default_palette: 0
  size: 256

  # Palette legend (what each pal index renders as on the dungeon scene)
  legend:
    0: "default / floor / void / structural transitions / text"
    1: "health and restoration pickups (cherry red)"
    2: "rare, life, score, and wildcard pickups (purple)"
    3: "status-cure pickups (green)"
    4: "shield, arrow, and teleport pickups (cyan)"
    5: "attack/form-power pickups + spike rings/body/wall connector (gold/red); later scenes reuse the slot for lava"
    6: "walls + unpainted spike shadows (slate/gunmetal metallic ramp)"
    7: "Stage-1 rotating teeth; scene-local colors come from penta_palettes_v097.yaml and normal BG7 is restored elsewhere"

  categories:
    - name: wall_edge
      palette: 6
      description: "Wall edge tiles, slate-gray metallic ramp."
      tiles: [0x14, 0x16, 0x17, 0x18, 0x19, 0x1A, 0x1C, 0x1E]

    - name: wall_interior
      palette: 6
      description: "Wall interior fill tiles, same slate-gray ramp."
      tiles: [0x25, 0x26, 0x34, 0x35, 0x36, 0x37, 0x38]

    - name: corner_doorway
      palette: 6
      description: |
        Wall corners and doorway framing. 0x47/0x57 INCLUDED here
        (NOT in hazard list) because wall-corner artifacts are more
        visible than wall-colored spikes (regression 2026-05-23 chose
        pal 6 for these dual-use tiles).
      tiles: [0x41, 0x42, 0x44, 0x45, 0x46, 0x47, 0x48, 0x49,
              0x54, 0x55, 0x56, 0x57, 0x59]

    - name: hazard_spike_legacy_accent
      palette: 5
      description: |
        Legacy 2A-3D spike accents. They do not share the large rotating
        cylinder's floor-bearing art. Excludes 0x47/0x57, which remain wall
        corners after the 2026-05-23 headed regression.
      tiles: [0x2A, 0x2B, 0x2C, 0x2D, 0x2E, 0x3A, 0x3B, 0x3C, 0x3D]

    - name: hazard_spike_teeth
      palette: 7
      description: |
        The 12 protruding tooth/drill animation frames. Semantic source-art
        masks preserve their embedded blue checkerboard while filling the
        complete outlined tooth with the Stage-1-only BG7 material row.
      tile_ranges:
        - [0x64, 0x69]
        - [0x74, 0x79]

    - name: hazard_spike_fire_body
      palette: 5
      description: |
        Four rotating rings plus the four continuous cylinder/end-cap cells.
        Their reviewed semantic art uses BG5 yellow/red without painting the
        embedded floor or the 63/73 cast-shadow column.
      tiles: [0x61, 0x62, 0x6C, 0x6D, 0x6E, 0x71, 0x72, 0x7C, 0x7D, 0x7E]

    - name: hazard_spike_wall_connector
      palette: 5
      description: |
        The upper/lower mixed cells where the rotating cylinder enters its
        left wall. Reviewed masks extend the gold/red material to the black
        cylinder outline while collapsing only the tiny wall-side remainder
        to neutral white/black, avoiding the old five-pixel gray collar.
      tiles: [0x60, 0x70]

    - name: hazard_spike_support
      palette: 6
      description: |
        Remaining 60-7F rail, support, and shadow cells. These retain stock
        art and the stable wall-compatible metallic ramp until a future
        animation capture proves a more specific material role.
      tiles: [
        0x63, 0x6A, 0x6B, 0x6F,
        0x73, 0x7A, 0x7B, 0x7F
      ]

    - name: pickup_health_restore
      palette: 1
      description: |
        Health 1 and Health 2 share the 88/89/98/99 block. Health 2 replaces
        its lower-right 99 tile with 96. Keep both forms on the red health
        palette.
      tiles: [0x88, 0x89, 0x96, 0x98, 0x99]

    - name: pickup_status_cure
      palette: 3
      description: |
        Poison Cure (8A/8B/9A/9B) and Slow Cure (8C/8D/9C/9D).
      tiles: [0x8A, 0x8B, 0x8C, 0x8D, 0x9A, 0x9B, 0x9C, 0x9D]

    - name: pickup_shield_defense
      palette: 4
      description: "Shield pickup (84/85/94/95), cyan defense class."
      tiles: [0x84, 0x85, 0x94, 0x95]

    - name: pickup_attack_power
      palette: 5
      description: |
        Gold/red attack and form-power class: Spiral (8E), Turbo (A8),
        Flash (AA), Rock (C8), and Dragon (CE). Each named base expands to
        base/base+1/base+16/base+17.
      tiles: [
        0x8E, 0x8F, 0x9E, 0x9F,
        0xA8, 0xA9, 0xB8, 0xB9,
        0xAA, 0xAB, 0xBA, 0xBB,
        0xC8, 0xC9, 0xD8, 0xD9,
        0xCE, 0xCF, 0xDE, 0xDF
      ]

    - name: pickup_navigation_arrow
      palette: 4
      description: |
        Cyan navigation class: Fat Arrow (A0), Bidirectional Arrow (A2),
        Half-Diagonal Arrow (A4), All-Diagonals Arrow (A6), and Teleport
        (AC). Each named base expands to its complete 2x2 block.
      tiles: [
        0xA0, 0xA1, 0xB0, 0xB1,
        0xA2, 0xA3, 0xB2, 0xB3,
        0xA4, 0xA5, 0xB4, 0xB5,
        0xA6, 0xA7, 0xB6, 0xB7,
        0xAC, 0xAD, 0xBC, 0xBD
      ]

    - name: pickup_rare_score
      palette: 2
      description: |
        Purple rare/score class: Extra Life (AE), Wild Card (C6), P item
        (CA), and Orb (CC). Each named base expands to its complete 2x2 block.
      tiles: [
        0xAE, 0xAF, 0xBE, 0xBF,
        0xC6, 0xC7, 0xD6, 0xD7,
        0xCA, 0xCB, 0xDA, 0xDB,
        0xCC, 0xCD, 0xDC, 0xDD
      ]

    - name: pickup_font_no_bleed
      palette: 0
      description: |
        Exact neutral gaps surrounding the now-inventoried pickup blocks.
        These contain font, menu, and reused structural art that caused the
        old blanket 80-DF mapping to bleed.
      tile_ranges:
        - [0x80, 0x83]
        - [0x86, 0x87]
        - [0x90, 0x93]
        - [0x97, 0x97]
        - [0xC0, 0xC5]
        - [0xD0, 0xD5]
        - [0xF0, 0xFF]

    - name: sentinel_reset
      palette: 0
      description: |
        Historical pal-7 sentinel slot. Explicitly cleared to pal 0 in v3.01
        because the inline tile+attr copy at 0x42A7 writes bg_table[tile_id]
        as the attr byte; tile 0xFF with attr 0xFF would paint pal-7 splotch.
      tiles: [0xFF]

  notes:
    - "Stage 1 maps teeth 0x64-0x69/0x74-0x79 to scene-local BG7, rings/body 61/62/6C/6D/6E/71/72/7C/7D/7E to BG5, and unclassified supports to BG6. Title/menu, the secret jet stage, and later-stage reuse retain their normal palette paths."
    - "Pal 5 is attack-power gold/red in Stage 1; Stage 5/7 scene-specific tables reuse the hardware slot for lava."
    - "The base build still aliases BG7 to BG0 for boot/title safety. The release loader selects the Stage-1-only tooth row when the active FFD0 stage flag is 00, and restores normal YAML BG7 in the bonus and later stages."

