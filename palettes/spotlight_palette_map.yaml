# Title-idle spotlight roster (stock table at ROM 0x522A).
#
# The reel reloads every actor into tiles 0x08-0x0F, so runtime tile IDs cannot
# select a palette. `gameplay_tile` names the byte-identical 128-byte graphics
# block's normal gameplay destination. The builder resolves that tile through
# monster_palette_map.yaml, keeping the reel and gameplay on the same palette
# families. Sara is dynamic in gameplay, so her two forms are explicit here.
roster:
